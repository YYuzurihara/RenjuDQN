batch_size: 1024
max_epochs: 100
learning_rate: 1e-4
weight_decay: 0.01
gradient_clip_norm: 1.0
device: auto
output_root: artifacts
checkpoint_dir: checkpoints
checkpoint_name: best_model.pt
log_every_steps: 20

# DQN
gamma: 0.99
reward_shaping_coefficient: 0.0 # weight on the potential-based shaping term added to the
# sparse terminal reward (see reward.py); set to 0 to disable shaping and train on the sparse
# +-1/0 terminal reward alone.
double_dqn: false # if true, the online network selects the next action and the target network
# only evaluates it (Double DQN), instead of the target network doing both (vanilla DQN), which
# curbs max-Q overestimation bias.
replay_buffer_capacity: 1000000 #1M
target_update_interval: 200 # gradient steps between hard target-network syncs
steps_per_epoch: 2000 # gradient steps per epoch
# Self-play (actor thread) and replay_buffer.sample() (prefetch threads) run independently of
# the learner loop, each on their own thread(s), so training isn't blocked alternating between
# self-play, batch prep, and the GPU step.
max_games_per_epoch: 30000 # soft cap on self-play games per epoch; once reached, the actor thread
# idles until the next epoch. Left uncapped (null), the actor runs as fast as it can, so the
# self-play/gradient-update ratio -- and therefore the buffer's state-action distribution --
# drifts with however fast that thread happens to run relative to the learner (hardware-dependent,
# not reproducible across runs). Set this to pin that ratio to steps_per_epoch instead. With
# self_play_batch_games games in flight at once, this can overshoot by up to
# self_play_batch_games - 1 (several can cross the cap in the same ply-step) -- fine as a sizing
# target, not exact enough to rely on for a hard per-epoch count.
# 30000 targets replay_buffer_capacity/2 = 500k online transitions: data.csv's warmup set
# averages ~16 plies/game (3000 games, ~49k transitions), so ~30k self-play games produce
# ~500k transitions -- by the end of epoch 1, updated-model data reaches roughly half of the
# buffer's total capacity (well before the buffer is full enough to start evicting warmup rows).
# It keeps growing past that in later epochs as self-play keeps accumulating on top of it.
prefetch_workers: 8 # threads calling replay_buffer.sample() concurrently to keep the GPU fed
self_play_batch_games: 64 # self-play games run concurrently (in lockstep) on the actor thread;
# every ply, all of them are scored in a single batched forward pass instead of one board at a
# time, so self-play games/sec scales with this instead of being capped by per-call GPU launch
# overhead. Raise it until the actor thread's games/epoch approaches max_games_per_epoch (or GPU
# memory/contention with the learner's own batches becomes the limit); the learner thread shares
# the same GPU, so pushing this too high can slow down gradient steps instead of self-play.

exploration: epsilon_greedy # epsilon_greedy or noisy_net.
# epsilon_greedy: self-play picks a uniformly random legal move with probability epsilon
# (annealed below), otherwise the greedy argmax move.
# noisy_net: the model's output head uses NoisyLinear (Fortunato et al., 2018) instead of
# plain Linear layers, so the network's own weight noise drives exploration; self-play always
# plays the greedy argmax move and resamples the noise before each one. epsilon_start/epsilon_end
# are ignored in this mode.
epsilon_start: 1.0
epsilon_end: 0.1
# epsilon is annealed by curriculum progress rather than a step count (see
# epsilon_for_curriculum in train.py): epsilon_start while the window below covers none of the
# game, decaying to epsilon_end exactly as the window reaches the full board. This keeps
# self-play exploring for as long as curriculum training hasn't reached the states self-play is
# generating, and it automatically tracks curriculum_step_size below if it changes.
epsilon_decay_rate: 0.0 # shape of the epsilon_start -> epsilon_end interpolation over curriculum
# progress: 0 is linear; positive values front-load the drop (steep early, flattening toward
# epsilon_end) via a normalized exponential. Higher = steeper early decay.

# Curriculum learning: sample only within the last `curriculum_step_size * epoch` steps of each
# game, expanding the window as training progresses (e.g. epoch 1 -> last 5 steps, epoch 2 ->
# last 10 steps, ... with the default below). Tune the pace via steps_per_epoch, not a separate
# interval knob. Set curriculum_step_size to 0 to disable and always sample from the full buffer.
curriculum_step_size: 5

checkpoint_every_epochs: 5 # in addition to best_model.pt (see is_best in train.py), also save a
# separate, epoch-indexed checkpoint every N epochs under checkpoint_dir/<run_name>/, so a
# specific epoch's weights can be inspected/exported later regardless of how best_model.pt was
# picked. Set to 0 to disable.
