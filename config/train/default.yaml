batch_size: 512
max_epochs: 100
learning_rate: 1e-4
weight_decay: 0.01
gradient_clip_norm: 1.0
device: auto
output_root: artifacts
checkpoint_dir: checkpoints
checkpoint_name: best_model.pt
log_every_steps: 20

# DQN
gamma: 0.99
replay_buffer_capacity: 1000000 #1M
target_update_interval: 200 # gradient steps between hard target-network syncs
steps_per_epoch: 300 # self-play games per epoch
updates_per_game: 4 # gradient updates after each self-play game
epsilon_start: 1.0
epsilon_end: 0.1
epsilon_decay_steps: 20000 # anneal over this many gradient steps
