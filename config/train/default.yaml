batch_size: 512
max_epochs: 100
learning_rate: 1e-4
weight_decay: 0.01
gradient_clip_norm: 1.0
device: auto
output_root: artifacts
checkpoint_dir: checkpoints
checkpoint_name: best_model.pt
log_every_steps: 20

# DQN
gamma: 0.99
replay_buffer_capacity: 1000000 #1M
target_update_interval: 200 # gradient steps between hard target-network syncs
steps_per_epoch: 300 # epoch size in units of "self-play games worth" of gradient steps
updates_per_game: 4 # steps_per_epoch * updates_per_game = gradient steps per epoch
# Self-play (actor thread) and replay_buffer.sample() (prefetch threads) run independently of
# the learner loop, each on their own thread(s), so training isn't blocked alternating between
# self-play, batch prep, and the GPU step.
prefetch_workers: 4 # threads calling replay_buffer.sample() concurrently to keep the GPU fed
epsilon_start: 1.0
epsilon_end: 0.1
# epsilon is annealed by curriculum progress rather than a step count (see
# epsilon_for_curriculum in train.py): epsilon_start while the window below covers none of the
# game, decaying to epsilon_end exactly as the window reaches the full board. This keeps
# self-play exploring for as long as curriculum training hasn't reached the states self-play is
# generating, and it automatically tracks curriculum_step_size / curriculum_epoch_interval below
# if they change.

# Curriculum learning: sample only within the last `curriculum_step_size * ceil(epoch /
# curriculum_epoch_interval)` steps of each game, expanding the window as training progresses
# (e.g. epoch 1 -> last 5 steps, epoch 2 -> last 10 steps, ... with the defaults below).
# Set curriculum_step_size to 0 to disable and always sample from the full buffer.
curriculum_step_size: 5
curriculum_epoch_interval: 1
