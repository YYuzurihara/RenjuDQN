<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Renju DQN ONNX デモ</title>
    <style>
      :root {
        color-scheme: dark;
        font-size: clamp(14px, 0.6vw + 12px, 22px);
        --bg: #060708;
        --panel: rgba(255, 255, 255, 0.055);
        --panel-strong: rgba(255, 255, 255, 0.09);
        --ink: #eef1f6;
        --muted: #9aa3b3;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #29a883;
        --accent-2: #e0793f;
        --glass-blur: blur(18px) saturate(150%);
        --board-wood-dark: #241708;
        --board-wood-light: #3c2712;
        --heat-low: #12283f;
        --heat-high: #4da3ff;
        --sheen-diagonal: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0) 30%,
          rgba(255, 255, 255, 0) 70%,
          rgba(255, 255, 255, 0.06) 100%
        );
        --sheen-vertical: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.32) 0%,
          rgba(255, 255, 255, 0.04) 45%,
          rgba(255, 255, 255, 0) 55%,
          rgba(0, 0, 0, 0.1) 100%
        );
        --sheen-diagonal-soft: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0) 30%,
          rgba(255, 255, 255, 0) 70%,
          rgba(255, 255, 255, 0.02) 100%
        );
        --glass-edge: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -1px 0 rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(70, 120, 255, 0.12) 0, transparent 34%),
          radial-gradient(circle at bottom right, rgba(255, 90, 90, 0.08) 0, transparent 40%),
          linear-gradient(180deg, #0a0c10 0%, var(--bg) 100%);
        background-attachment: fixed;
        background-color: var(--bg);
        color: var(--ink);
      }

      main {
        width: calc(100vw - 2em);
        margin: 2em auto;
        padding: 1.5em;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--sheen-diagonal), var(--panel);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.55),
          var(--glass-edge);
      }

      h1 {
        margin: 0 0 0.5em;
        font-size: 2rem;
      }

      .page-header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .page-header-copy {
        display: grid;
        gap: 8px;
      }

      .page-header-copy p {
        margin: 0;
      }

      p,
      label,
      input,
      select,
      textarea,
      button,
      pre {
        font: inherit;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 1em;
      }

      .grid.two {
        grid-template-columns: repeat(auto-fit, minmax(17.5em, 1fr));
      }

      .field {
        display: grid;
        gap: 0.5em;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 0.75em 0.875em;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--sheen-diagonal), rgba(255, 255, 255, 0.06);
        box-shadow: var(--glass-edge);
        color: var(--ink);
      }

      textarea {
        min-height: 160px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75em;
      }

      .play-area {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(17.5em, 0.9fr);
        gap: 1.25em;
        align-items: start;
      }

      .board-shell {
        position: relative;
        padding: 1em;
        border: 1px solid var(--line);
        border-radius: 18px;
        background:
          var(--sheen-diagonal),
          linear-gradient(160deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.015) 100%),
          radial-gradient(circle at 25% 15%, rgba(255, 200, 130, 0.09) 0%, transparent 55%),
          linear-gradient(160deg, var(--board-wood-light) 0%, var(--board-wood-dark) 100%);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 0 40px rgba(0, 0, 0, 0.5),
          0 12px 30px rgba(0, 0, 0, 0.45);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(15, minmax(1.1em, 1fr));
        gap: 0.15em;
        aspect-ratio: 1;
      }

      .cell {
        position: relative;
        border: 0;
        border-radius: 4px;
        background:
          var(--sheen-diagonal),
          linear-gradient(var(--heat-color, transparent), var(--heat-color, transparent)),
          rgba(255, 214, 160, 0.05);
        box-shadow: var(--glass-edge);
        min-width: 0;
        min-height: 0;
        padding: 0;
        transition: background 220ms ease;
      }

      .cell::before,
      .cell::after {
        content: "";
        position: absolute;
        background: rgba(255, 232, 200, 0.2);
      }

      .cell::before {
        left: 50%;
        top: 0;
        width: 1px;
        height: 100%;
        transform: translateX(-50%);
      }

      .cell::after {
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        transform: translateY(-50%);
      }

      .stone {
        position: absolute;
        inset: 14%;
        border-radius: 50%;
        box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.2), 0 2px 4px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      .stone.black {
        background: radial-gradient(circle at 30% 30%, #5a5a5a 0%, #1a1a1a 60%, #000 100%);
        box-shadow:
          inset 0 2px 6px rgba(255, 255, 255, 0.2),
          0 2px 4px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.18);
      }

      .stone.white {
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f2eadb 56%, #d8ccb8 100%);
        box-shadow:
          inset 0 2px 6px rgba(255, 255, 255, 0.2),
          0 2px 4px rgba(0, 0, 0, 0.5);
      }

      .cell.legal {
        outline: 1px solid rgba(58, 200, 168, 0.4);
      }

      .cell.last-move {
        box-shadow: inset 0 0 0 2px rgba(224, 121, 63, 0.9);
      }

      .cell.opening-target {
        outline: 2px solid rgba(224, 121, 63, 0.9);
        outline-offset: -2px;
      }

      .cell.opening-target::before,
      .cell.opening-target::after {
        background: rgba(224, 121, 63, 0.75);
      }

      .opening-tip {
        position: absolute;
        left: 50%;
        top: calc(50% - 2.2em);
        transform: translate(-50%, -100%);
        z-index: 3;
        max-width: min(17.5em, calc(100% - 2em));
        padding: 0.6em 0.85em;
        border: 1px solid rgba(192, 97, 47, 0.35);
        border-radius: 14px;
        background: rgba(20, 22, 28, 0.85);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        color: var(--ink);
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.45;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }

      .opening-tip::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -10px;
        width: 16px;
        height: 16px;
        background: inherit;
        border-right: 1px solid rgba(192, 97, 47, 0.35);
        border-bottom: 1px solid rgba(192, 97, 47, 0.35);
        transform: translateX(-50%) rotate(45deg);
      }

      .opening-tip[hidden] {
        display: none;
      }

      .turn-select-overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1em;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .turn-select-overlay[hidden] {
        display: none;
      }

      .turn-select-panel {
        display: grid;
        gap: 1em;
        max-width: min(20em, 100%);
        padding: 1.5em;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--sheen-diagonal), rgba(22, 24, 30, 0.8);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.5),
          var(--glass-edge);
        text-align: center;
      }

      .turn-select-title {
        margin: 0;
        font-weight: 700;
      }

      .turn-select-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75em;
      }

      .panel {
        padding: 1em;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--sheen-diagonal), var(--panel);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-edge);
      }

      .stats {
        display: grid;
        gap: 0.625em;
      }

      .stat {
        padding: 0.75em 0.875em;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--sheen-diagonal-soft), rgba(0, 0, 0, 0.4);
        box-shadow: var(--glass-edge);
      }

      .moves {
        max-height: 13.75em;
        overflow: auto;
        padding: 0.75em 0.875em;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--sheen-diagonal-soft), rgba(0, 0, 0, 0.4);
        box-shadow: var(--glass-edge);
        white-space: pre-wrap;
      }

      .qheat-legend {
        display: grid;
        gap: 0.375em;
        margin-top: 0.75em;
        padding: 0.625em 0.75em;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--sheen-diagonal-soft), rgba(0, 0, 0, 0.35);
        box-shadow: var(--glass-edge);
      }

      .qheat-legend[hidden] {
        display: none;
      }

      .qheat-caption {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .qheat-scale {
        height: 0.625em;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--heat-low), var(--heat-high));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }

      .qheat-range {
        display: flex;
        justify-content: space-between;
        font-size: 0.78rem;
        color: var(--muted);
        font-family: Consolas, monospace;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.75em 1.125em;
        cursor: pointer;
        color: white;
        background: var(--sheen-vertical), var(--accent);
        box-shadow:
          var(--glass-edge),
          0 4px 14px rgba(0, 0, 0, 0.3);
      }

      button.secondary {
        background: var(--sheen-vertical), var(--accent-2);
      }

      .language-toggle {
        position: relative;
        display: inline-flex;
        gap: 0;
        padding: 4px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--sheen-vertical), rgba(255, 255, 255, 0.06);
        box-shadow: var(--glass-edge);
      }

      .language-toggle-glass {
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 4px;
        width: calc(50% - 4px);
        border-radius: 999px;
        background: var(--sheen-diagonal), rgba(41, 168, 131, 0.38);
        border: 1px solid rgba(90, 230, 190, 0.55);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow:
          var(--glass-edge),
          0 0 16px rgba(41, 168, 131, 0.65),
          0 2px 10px rgba(0, 0, 0, 0.35);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .language-toggle[data-selected="en"] .language-toggle-glass {
        transform: translateX(100%);
      }

      .language-option {
        position: relative;
        z-index: 1;
        min-width: 2.6em;
        padding: 0.5em 0.75em;
        border: 0;
        border-radius: 999px;
        background: transparent;
        box-shadow: none;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .language-option[aria-pressed="true"] {
        color: var(--ink);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        padding: 0.75em 0.875em;
        border-radius: 12px;
        background: var(--sheen-diagonal-soft), rgba(0, 0, 0, 0.4);
        border: 1px solid var(--line);
        box-shadow: var(--glass-edge);
      }

      pre {
        margin: 0;
        padding: 1em;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--sheen-diagonal-soft), rgba(0, 0, 0, 0.65);
        box-shadow: var(--glass-edge);
        color: #eef7f0;
        overflow: auto;
      }

      code {
        font-family: Consolas, monospace;
      }

      @media (min-width: 820px) {
        :root {
          font-size: clamp(11px, 0.48vw + 10px, 18px);
        }

        main {
          width: calc((100vw - 2em) * 0.8);
        }
      }

      @media (max-width: 820px) {
        .play-area {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .page-header {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="grid">
      <header class="page-header">
        <div class="page-header-copy">
          <h1 data-i18n="title">Renju DQN ONNX デモ</h1>
          <p class="muted" data-i18n-html="introHtml">
            同じディレクトリにある <code>renju_dqn.onnx</code> と metadata JSON を読み込み、
            ブラウザ上で次の一手を推論します。
          </p>
        </div>
        <div
          id="language-toggle"
          class="language-toggle"
          role="group"
          aria-label="表示言語"
          data-selected="ja"
        >
          <span class="language-toggle-glass" aria-hidden="true"></span>
          <button
            type="button"
            id="language-option-ja"
            class="language-option"
            data-lang="ja"
            aria-pressed="true"
          >
            JA
          </button>
          <button
            type="button"
            id="language-option-en"
            class="language-option"
            data-lang="en"
            aria-pressed="false"
          >
            EN
          </button>
        </div>
      </header>

      <section class="play-area">
        <div class="board-shell">
          <div class="turn-select-overlay" id="turn-select-overlay">
            <div class="turn-select-panel">
              <p class="turn-select-title" data-i18n="turnSelectTitle">あなたの手番を選んでください</p>
              <div class="turn-select-actions">
                <button
                  type="button"
                  class="turn-select-button"
                  data-color="black"
                  data-i18n="humanColorBlackOption"
                >
                  黒(先手)
                </button>
                <button
                  type="button"
                  class="turn-select-button secondary"
                  data-color="white"
                  data-i18n="humanColorWhiteOption"
                >
                  白(後手)
                </button>
              </div>
            </div>
          </div>
          <div class="opening-tip" id="opening-tip" data-i18n="openingTip" hidden>
            初手なので中央においてね
          </div>
          <div class="board" id="board"></div>
          <div class="qheat-legend" id="qheat-legend" hidden>
            <span class="qheat-caption" data-i18n="qHeatmapCaption">Q値ヒートマップ（濃紺=低い, 明るい青=高い）</span>
            <div class="qheat-scale" aria-hidden="true"></div>
            <div class="qheat-range">
              <span id="qheat-min">-</span>
              <span id="qheat-max">-</span>
            </div>
          </div>
        </div>
        <div class="panel grid">
          <div class="stats">
            <div class="stat" id="turn-status">手番: 黒(あなた)</div>
            <div class="stat" id="game-status">状態: 開始前</div>
            <div class="stat" id="ai-status">AI: まだ着手していません</div>
            <div class="stat" id="reward-status">報酬: まだ手がありません</div>
          </div>
          <div class="actions">
            <button id="new-game" type="button" data-i18n="newGameButton">新しい対局</button>
            <button id="ai-move" type="button" class="secondary" data-i18n="aiMoveButton">
              AI に着手させる
            </button>
            <button id="reward-shaping-toggle" type="button" class="secondary" aria-pressed="true">
              報酬シェーピング: ON
            </button>
          </div>
          <div>
            <label for="move-log" data-i18n="moveLogLabel">棋譜ログ</label>
            <div class="moves" id="move-log">まだ手がありません。</div>
          </div>
        </div>
      </section>

      <section class="grid two">
        <div class="field">
          <label for="model-url" data-i18n="modelUrlLabel">モデル URL</label>
          <input id="model-url" value="./renju_dqn.onnx" />
        </div>
        <div class="field">
          <label for="metadata-url" data-i18n="metadataUrlLabel">metadata URL</label>
          <input id="metadata-url" value="./renju_dqn.onnx.metadata.json" />
        </div>
      </section>

      <section class="grid">
        <div class="field">
          <label for="board-csv" data-i18n="boardCsvLabel">盤面 CSV</label>
          <textarea
            id="board-csv"
            spellcheck="false"
            data-i18n-placeholder="boardCsvPlaceholder"
            placeholder="225 個の 0/1/2 をカンマ区切りで入力してください。0=空, 1=黒, 2=白"
          ></textarea>
        </div>
        <div class="actions">
          <button id="fill-empty" type="button" class="secondary" data-i18n="fillEmptyButton">
            空盤面を入れる
          </button>
          <button id="load-model" type="button" data-i18n="loadModelButton">モデルを読み込む</button>
          <button id="run-predict" type="button" data-i18n="runPredictButton">推論する</button>
        </div>
      </section>

      <section class="grid two">
        <div class="status" id="status">モデル未ロード</div>
        <div class="status" id="board-info">盤面セル数: 未入力</div>
      </section>

      <section class="grid">
        <label for="result" data-i18n="resultLabel">推論結果</label>
        <pre id="result">まだ推論していません。</pre>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.min.js"></script>
    <script type="module">
      import {
        BLACK,
        DRAW,
        WHITE,
        boardIsFull,
        boardWinner,
        computeReward,
        inferPlayer,
        legalMoveMask,
        loadModel,
        parseBoardCsv,
        predictBoard,
        setOrtRuntime,
      } from "./renju_onnx.js";

      const ORT_VERSION = "1.23.2";
      // Matches config/train/default.yaml's gamma; this static page has no build step
      // to read the Hydra config, so keep the two values in sync by hand.
      const DEFAULT_GAMMA = 0.99;
      setOrtRuntime(globalThis.ort);
      ort.env.wasm.wasmPaths = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/`;

      const modelUrlInput = document.querySelector("#model-url");
      const metadataUrlInput = document.querySelector("#metadata-url");
      const boardCsvInput = document.querySelector("#board-csv");
      const boardNode = document.querySelector("#board");
      const openingTipNode = document.querySelector("#opening-tip");
      const loadButton = document.querySelector("#load-model");
      const predictButton = document.querySelector("#run-predict");
      const fillEmptyButton = document.querySelector("#fill-empty");
      const newGameButton = document.querySelector("#new-game");
      const aiMoveButton = document.querySelector("#ai-move");
      const turnSelectOverlay = document.querySelector("#turn-select-overlay");
      const turnSelectButtons = document.querySelectorAll(".turn-select-button");
      const rewardShapingToggleButton = document.querySelector("#reward-shaping-toggle");
      const statusNode = document.querySelector("#status");
      const boardInfoNode = document.querySelector("#board-info");
      const turnStatusNode = document.querySelector("#turn-status");
      const gameStatusNode = document.querySelector("#game-status");
      const aiStatusNode = document.querySelector("#ai-status");
      const rewardStatusNode = document.querySelector("#reward-status");
      const moveLogNode = document.querySelector("#move-log");
      const resultNode = document.querySelector("#result");
      const qheatLegendNode = document.querySelector("#qheat-legend");
      const qheatMinNode = document.querySelector("#qheat-min");
      const qheatMaxNode = document.querySelector("#qheat-max");
      const languageToggleNode = document.querySelector("#language-toggle");
      const languageOptionButtons = document.querySelectorAll(".language-option");

      const LANGUAGE_STORAGE_KEY = "renju-transformer.docs.language";
      const LANGUAGES = ["ja", "en"];
      const I18N = {
        ja: {
          ai: "AI",
          aiAfterHumanMove: "AI: あなたの着手後に応答します",
          aiAssistedMove: ({coord, index, qValue}) =>
            `AI(代打ち): ${coord} に着手 (top1=${index}, q=${qValue})`,
          aiFailed: ({message}) => `AI: 失敗 (${message})`,
          aiIdle: "AI: まだ着手していません",
          aiMoveButton: "AI に着手させる",
          aiMoveFailed: "AI 着手失敗",
          aiMoved: ({coord, index, qValue}) => `AI: ${coord} に着手 (top1=${index}, q=${qValue})`,
          aiSuggestingMove: "AI があなたの代わりに考えています...",
          aiSyncedFromTextarea: "AI: textarea から盤面を反映",
          aiThinking: "AI が考えています...",
          aiTurn: "AI の手番",
          black: "黒",
          blackWins: "黒の勝ち",
          boardApplied: "盤面を反映",
          boardCsvLabel: "盤面 CSV",
          boardCsvPlaceholder: "225 個の 0/1/2 をカンマ区切りで入力してください。0=空, 1=黒, 2=白",

      function readLanguagePreference() {
        try {
          const storedLanguage = localStorage.getItem(LANGUAGE_STORAGE_KEY);
          if (LANGUAGES.includes(storedLanguage)) {
            return storedLanguage;
          }
        } catch {
          // Keep the default when storage is unavailable.
        }
        return "ja";
      }

      let currentLanguage = readLanguagePreference();
      const displayState = {
        aiStatus: {key: "aiIdle", args: {}},
        result: {kind: "translated", key: "resultIdle", args: {}},
        rewardStatus: {key: "rewardStatusIdle", args: {}},
        status: {key: "modelUnloaded", args: {}},
      };

      let loaded = null;
      let rewardShapingEnabled = true;
      let humanPlayer = BLACK;

      function aiPlayer() {
        return humanPlayer === BLACK ? WHITE : BLACK;
      }
      const gameState = {
        board: new Array(225).fill(0),
        busy: false,
        gameMessage: {key: "newGame", args: {}},
        over: false,
        lastMoveIndex: null,
        moveLog: [],
        qValueHeat: null,
      };

      const HEAT_LOW_RGB = [18, 40, 63];
      const HEAT_HIGH_RGB = [77, 163, 255];

      function computeHeatRange(heat) {
        if (!heat) {
          return null;
        }
        let min = Infinity;
        let max = -Infinity;
        for (const value of heat) {
          if (Number.isFinite(value)) {
            if (value < min) min = value;
            if (value > max) max = value;
          }
        }
        return Number.isFinite(min) && Number.isFinite(max) ? {min, max} : null;
      }

      function heatColorForValue(value, range) {
        if (!range || !Number.isFinite(value)) {
          return null;
        }
        const span = range.max - range.min;
        const t = span > 1e-9 ? Math.min(1, Math.max(0, (value - range.min) / span)) : 0.5;
        const r = Math.round(HEAT_LOW_RGB[0] + (HEAT_HIGH_RGB[0] - HEAT_LOW_RGB[0]) * t);
        const g = Math.round(HEAT_LOW_RGB[1] + (HEAT_HIGH_RGB[1] - HEAT_LOW_RGB[1]) * t);
        const b = Math.round(HEAT_LOW_RGB[2] + (HEAT_HIGH_RGB[2] - HEAT_LOW_RGB[2]) * t);
        return `rgba(${r}, ${g}, ${b}, 0.62)`;
      }

      function renderQHeatLegend(range) {
        if (!range) {
          qheatLegendNode.hidden = true;
          return;
        }
        qheatLegendNode.hidden = false;
        qheatMinNode.textContent = range.min.toFixed(3);
        qheatMaxNode.textContent = range.max.toFixed(3);
      }

      function t(key, args = {}) {
        const value = I18N[currentLanguage][key] ?? I18N.ja[key] ?? key;
        return typeof value === "function" ? value(args) : value;
      }

      function writeLanguagePreference(language) {
        try {
          localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
        } catch {
          // Language switching should still work when persistence is blocked.
        }
      }

      function indexToCoord(index, boardSize = 15) {
        const row = Math.floor(index / boardSize) + 1;
        const col = (index % boardSize) + 1;
        return `(${row}, ${col})`;
      }

      function playerName(player) {
        return player === BLACK ? t("black") : t("white");
      }

      function actorName(player) {
        return player === humanPlayer ? t("you") : t("ai");
      }

      function renderLanguageToggle() {
        languageToggleNode.dataset.selected = currentLanguage;
        languageToggleNode.setAttribute("aria-label", t("languageGroupLabel"));
        languageOptionButtons.forEach((button) => {
          const isSelected = button.dataset.lang === currentLanguage;
          button.setAttribute("aria-pressed", String(isSelected));
        });
      }

      function renderStatus() {
        statusNode.textContent = t(displayState.status.key, displayState.status.args);
      }

      function setStatus(key, args = {}) {
        displayState.status = {key, args};
        renderStatus();
      }

      function renderAiStatus() {
        aiStatusNode.textContent = t(displayState.aiStatus.key, displayState.aiStatus.args);
      }

      function setAiStatus(key, args = {}) {
        displayState.aiStatus = {key, args};
        renderAiStatus();
      }

      function renderRewardStatus() {
        rewardStatusNode.textContent = t(
          displayState.rewardStatus.key,
          displayState.rewardStatus.args,
        );
      }

      function setRewardStatus(key, args = {}) {
        displayState.rewardStatus = {key, args};
        renderRewardStatus();
      }

      function formatReward(reward) {
        return `${reward >= 0 ? "+" : ""}${reward.toFixed(4)}`;
      }

      function renderRewardShapingToggle() {
        const state = t(rewardShapingEnabled ? "rewardShapingOn" : "rewardShapingOff");
        rewardShapingToggleButton.textContent = t("rewardShapingToggleLabel", {state});
        rewardShapingToggleButton.setAttribute("aria-pressed", String(rewardShapingEnabled));
      }

      function renderResult() {
        resultNode.textContent =
          displayState.result.kind === "translated"
            ? t(displayState.result.key, displayState.result.args)
            : displayState.result.value;
      }

      function setResult(value) {
        displayState.result = {kind: "raw", value};
        renderResult();
      }

      function setTranslatedResult(key, args = {}) {
        displayState.result = {kind: "translated", key, args};
        renderResult();
      }

      function applyLanguage(language) {
        currentLanguage = language;
        document.documentElement.lang = language;
        document.title = t("title");
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          node.textContent = t(node.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((node) => {
          node.innerHTML = t(node.dataset.i18nHtml);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
          node.placeholder = t(node.dataset.i18nPlaceholder);
        });
        renderLanguageToggle();
        renderStatus();
        renderAiStatus();
        renderRewardStatus();
        renderRewardShapingToggle();
        renderResult();
        refreshGameSummary();
      }

      function updateBoardInfo() {
        const raw = boardCsvInput.value.trim();
        if (!raw) {
          boardInfoNode.textContent = t("boardInfoEmpty");
          return;
        }
        try {
          const board = parseBoardCsv(raw);
          boardInfoNode.textContent = t("boardInfoCount", {count: board.length});
        } catch (error) {
          boardInfoNode.textContent = t("boardInfoParseFailed", {message: error.message});
        }
      }

      function syncGameFromTextarea() {
        try {
          const board = parseBoardCsv(boardCsvInput.value.trim());
          if (board.length !== 225 || gameState.busy) {
            return;
          }
          legalMoveMask(board, loaded?.metadata);
          gameState.board = board;
          gameState.over = false;
          gameState.lastMoveIndex = null;
          gameState.moveLog = [];
          gameState.qValueHeat = null;
          setAiStatus("aiSyncedFromTextarea");
          refreshGameSummary("boardApplied");
          evaluateBoardAfterMove();
        } catch {
          // ignore partial or invalid edits
        }
      }

      function syncBoardCsv() {
        boardCsvInput.value = gameState.board.join(",");
        updateBoardInfo();
      }

      function legalMaskForCurrentBoard() {
        const metadata = loaded?.metadata;
        try {
          return legalMoveMask(gameState.board, metadata);
        } catch {
          return null;
        }
      }

      function isOpeningMove() {
        return gameState.board.every((cell) => cell === 0) && !gameState.busy && !gameState.over;
      }

      function renderMoveLog() {
        if (gameState.moveLog.length === 0) {
          moveLogNode.textContent = t("moveLogEmpty");
          return;
        }
        moveLogNode.textContent = gameState.moveLog
          .map((entry, index) => {
            if (typeof entry === "string") {
              return entry;
            }
            return t("moveLogEntry", {
              coord: indexToCoord(entry.index),
              moveNumber: index + 1,
              playerLabel: playerName(entry.player),
              qValue: entry.qValue,
              reward: entry.reward,
            });
          })
          .join("\n");
      }

      function renderBoard() {
        const legalMask = !gameState.over && !gameState.busy ? legalMaskForCurrentBoard() : null;
        const showOpeningTip = isOpeningMove();
        const centerIndex = Math.floor(gameState.board.length / 2);
        openingTipNode.hidden = !showOpeningTip;
        const heatRange = computeHeatRange(gameState.qValueHeat);
        renderQHeatLegend(heatRange);
        boardNode.replaceChildren();
        for (let index = 0; index < gameState.board.length; index += 1) {
          const cellValue = gameState.board[index];
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cell";
          button.dataset.index = String(index);
          button.title = indexToCoord(index);
          button.setAttribute("aria-label", t("cellLabel", {coord: indexToCoord(index)}));
          if (legalMask?.[index]) {
            button.classList.add("legal");
          }
          if (heatRange && gameState.qValueHeat) {
            const heatColor = heatColorForValue(gameState.qValueHeat[index], heatRange);
            if (heatColor) {
              button.style.setProperty("--heat-color", heatColor);
            }
          }
          if (showOpeningTip && index === centerIndex) {
            button.classList.add("opening-target");
          }
          if (gameState.lastMoveIndex === index) {
            button.classList.add("last-move");
          }
          if (cellValue !== 0) {
            const stone = document.createElement("span");
            stone.className = `stone ${cellValue === BLACK ? "black" : "white"}`;
            stone.ariaHidden = "true";
            button.append(stone);
          }
          button.addEventListener("click", () => handleHumanMove(index));
          boardNode.append(button);
        }
      }

      function currentPlayer() {
        try {
          return gameState.board.filter((value) => value === BLACK).length ===
            gameState.board.filter((value) => value === WHITE).length
            ? BLACK
            : WHITE;
        } catch {
          return BLACK;
        }
      }

      function refreshGameSummary(messageKey = null, args = {}) {
        if (messageKey) {
          gameState.gameMessage = {key: messageKey, args};
        }
        const player = currentPlayer();
        turnStatusNode.textContent = gameState.over
          ? t("turnGameOver")
          : t("turnCurrent", {actorLabel: actorName(player), playerLabel: playerName(player)});
        gameStatusNode.textContent = t("gameStatus", {
          message: t(gameState.gameMessage.key, gameState.gameMessage.args),
        });
        renderMoveLog();
        syncBoardCsv();
        renderBoard();
      }

      function finishGame(messageKey) {
        gameState.over = true;
        gameState.busy = false;
        refreshGameSummary(messageKey);
      }

      function evaluateBoardAfterMove() {
        const winner = boardWinner(gameState.board, loaded?.metadata);
        if (winner === BLACK) {
          finishGame("blackWins");
          return true;
        }
        if (winner === WHITE) {
          finishGame("whiteWins");
          return true;
        }
        if (boardIsFull(gameState.board, loaded?.metadata)) {
          finishGame("draw");
          return true;
        }
        return false;
      }

      // Reward shaping only cares whether *this* board is terminal and who won it —
      // same three cases evaluateBoardAfterMove() branches on, without the game-state side effects.
      function currentOutcome() {
        const winner = boardWinner(gameState.board, loaded?.metadata);
        if (winner === BLACK || winner === WHITE) {
          return {done: true, winner};
        }
        if (boardIsFull(gameState.board, loaded?.metadata)) {
          return {done: true, winner: DRAW};
        }
        return {done: false, winner: DRAW};
      }

      function recordMoveReward(prevBoard, player, index) {
        const outcome = currentOutcome();
        // Passing 0 zeroes out the shaping term but keeps the +-1 terminal reward intact.
        const coefficient = rewardShapingEnabled ? undefined : 0;
        const reward = computeReward(
          prevBoard,
          gameState.board,
          player,
          outcome.winner,
          outcome.done,
          DEFAULT_GAMMA,
          coefficient,
        );
        setRewardStatus("rewardStatusValue", {
          playerLabel: playerName(player),
          coord: indexToCoord(index),
          reward: formatReward(reward),
        });
        return reward;
      }

      function resetGame() {
        gameState.board = new Array(225).fill(0);
        gameState.busy = false;
        gameState.over = false;
        gameState.lastMoveIndex = null;
        gameState.moveLog = [];
        gameState.qValueHeat = null;
        setAiStatus("aiIdle");
        setRewardStatus("rewardStatusIdle");
        refreshGameSummary("newGame");
        setTranslatedResult("resultIdle");
      }

      async function startNewGame() {
        resetGame();
        if (aiPlayer() === BLACK) {
          await runAiMove();
        }
      }

      function showTurnSelectOverlay() {
        turnSelectOverlay.hidden = false;
      }

      function hideTurnSelectOverlay() {
        turnSelectOverlay.hidden = true;
      }

      async function ensureLoaded() {
        if (loaded) {
          return loaded;
        }
        setStatus("modelLoading");
        loaded = await loadModel(modelUrlInput.value.trim(), metadataUrlInput.value.trim(), {
          executionProviders: ["wasm"],
        });
        setStatus("modelLoaded", {
          boardSize: loaded.metadata.board_size,
          inChannels: loaded.metadata.in_channels,
        });
        return loaded;
      }

      function createEmptyBoardCsv() {
        return new Array(225).fill(0).join(",");
      }

      async function runAiMove() {
        if (gameState.busy || gameState.over) {
          return;
        }
        const currentAiPlayer = aiPlayer();
        if (currentPlayer() !== currentAiPlayer) {
          setStatus("notAiTurn");
          return;
        }

        gameState.busy = true;
        refreshGameSummary("aiThinking");
        try {
          const {session, metadata} = await ensureLoaded();
          const aiLastMoveIndex = gameState.lastMoveIndex;
          const prediction = await predictBoard(
            session,
            gameState.board,
            currentAiPlayer,
            aiLastMoveIndex,
            metadata,
            {topK: 5, applyLegalMask: true},
          );
          const aiIndex = prediction.predictedIndex;
          gameState.qValueHeat = prediction.maskedQValues;
          const prevBoard = gameState.board.slice();
          gameState.board[aiIndex] = currentAiPlayer;
          gameState.lastMoveIndex = aiIndex;
          const qValue = prediction.predictedQValue.toFixed(4);
          const reward = recordMoveReward(prevBoard, currentAiPlayer, aiIndex);
          gameState.moveLog.push({
            index: aiIndex,
            player: currentAiPlayer,
            qValue,
            reward: formatReward(reward),
          });
          setAiStatus("aiMoved", {
            coord: indexToCoord(aiIndex),
            index: aiIndex,
            qValue,
          });
          setResult(JSON.stringify(prediction, null, 2));
          if (!evaluateBoardAfterMove()) {
            gameState.busy = false;
            refreshGameSummary("yourTurn");
          }
        } catch (error) {
          gameState.busy = false;
          refreshGameSummary("aiMoveFailed");
          setAiStatus("aiFailed", {message: error.message});
          setResult(error.stack ?? String(error));
          setStatus("statusAiMoveFailed", {message: error.message});
        }
      }

      async function runAiAssistedHumanMove() {
        if (gameState.busy || gameState.over) {
          return;
        }
        if (currentPlayer() !== humanPlayer) {
          setStatus("notHumanTurn");
          return;
        }

        gameState.busy = true;
        refreshGameSummary("aiSuggestingMove");
        try {
          const {session, metadata} = await ensureLoaded();
          const lastMoveIndex = gameState.lastMoveIndex;
          const prediction = await predictBoard(
            session,
            gameState.board,
            humanPlayer,
            lastMoveIndex,
            metadata,
            {topK: 5, applyLegalMask: true},
          );
          const index = prediction.predictedIndex;
          gameState.qValueHeat = prediction.maskedQValues;
          const prevBoard = gameState.board.slice();
          gameState.board[index] = humanPlayer;
          gameState.lastMoveIndex = index;
          const qValue = prediction.predictedQValue.toFixed(4);
          const reward = recordMoveReward(prevBoard, humanPlayer, index);
          gameState.moveLog.push({
            index,
            player: humanPlayer,
            qValue,
            reward: formatReward(reward),
          });
          setAiStatus("aiAssistedMove", {coord: indexToCoord(index), index, qValue});
          setResult(JSON.stringify(prediction, null, 2));
          gameState.busy = false;
          if (evaluateBoardAfterMove()) {
            return;
          }
          setAiStatus("aiAfterHumanMove");
          refreshGameSummary("aiTurn");
          await runAiMove();
        } catch (error) {
          gameState.busy = false;
          refreshGameSummary("aiMoveFailed");
          setAiStatus("aiFailed", {message: error.message});
          setResult(error.stack ?? String(error));
          setStatus("statusAiMoveFailed", {message: error.message});
        }
      }

      async function handleHumanMove(index) {
        if (gameState.busy || gameState.over) {
          return;
        }
        if (currentPlayer() !== humanPlayer) {
          setStatus("notHumanTurn");
          return;
        }
        const legalMask = legalMaskForCurrentBoard();
        if (!legalMask?.[index]) {
          setStatus("illegalMove", {coord: indexToCoord(index)});
          return;
        }
        const prevBoard = gameState.board.slice();
        gameState.board[index] = humanPlayer;
        gameState.lastMoveIndex = index;
        gameState.qValueHeat = null;
        const reward = recordMoveReward(prevBoard, humanPlayer, index);
        gameState.moveLog.push({index, player: humanPlayer, reward: formatReward(reward)});
        setAiStatus("aiAfterHumanMove");
        refreshGameSummary("aiTurn");
        if (evaluateBoardAfterMove()) {
          return;
        }
        await runAiMove();
      }

      loadButton.addEventListener("click", async () => {
        loadButton.disabled = true;
        predictButton.disabled = true;
        try {
          loaded = null;
          await ensureLoaded();
        } catch (error) {
          setStatus("loadFailed", {message: error.message});
        } finally {
          loadButton.disabled = false;
          predictButton.disabled = false;
        }
      });

      predictButton.addEventListener("click", async () => {
        loadButton.disabled = true;
        predictButton.disabled = true;
        try {
          const {session, metadata} = await ensureLoaded();
          const board = parseBoardCsv(boardCsvInput.value.trim());
          const player = inferPlayer(board);
          const prediction = await predictBoard(session, board, player, null, metadata, {
            topK: 5,
            applyLegalMask: true,
          });
          gameState.qValueHeat = prediction.maskedQValues;
          renderBoard();
          setResult(JSON.stringify(prediction, null, 2));
          setStatus("inferenceComplete", {index: prediction.predictedIndex});
        } catch (error) {
          setResult(error.stack ?? String(error));
          setStatus("inferenceFailed", {message: error.message});
        } finally {
          loadButton.disabled = false;
          predictButton.disabled = false;
        }
      });

      fillEmptyButton.addEventListener("click", () => {
        resetGame();
      });

      newGameButton.addEventListener("click", () => {
        resetGame();
        showTurnSelectOverlay();
      });
      aiMoveButton.addEventListener("click", runAiAssistedHumanMove);
      turnSelectButtons.forEach((button) => {
        button.addEventListener("click", () => {
          humanPlayer = button.dataset.color === "white" ? WHITE : BLACK;
          hideTurnSelectOverlay();
          startNewGame();
        });
      });
      rewardShapingToggleButton.addEventListener("click", () => {
        rewardShapingEnabled = !rewardShapingEnabled;
        renderRewardShapingToggle();
      });
      languageOptionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const nextLanguage = button.dataset.lang;
          if (nextLanguage === currentLanguage) {
            return;
          }
          writeLanguagePreference(nextLanguage);
          applyLanguage(nextLanguage);
        });
      });

      boardCsvInput.addEventListener("input", () => {
        updateBoardInfo();
        syncGameFromTextarea();
      });
      boardCsvInput.value = createEmptyBoardCsv();
      applyLanguage(currentLanguage);
      resetGame();
      showTurnSelectOverlay();
    </script>
  </body>
</html>
